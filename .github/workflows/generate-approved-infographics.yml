name: Generate approved infographics

on:
  push:
    paths:
      - data/updates.json

  workflow_dispatch:
    inputs:
      pmid:
        description: Approved PMID to generate
        required: false
        type: string

      dry_run:
        description: Test only — do not generate images
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gastro-approved-infographics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and verify approved infographics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GEMINI_QA_MODEL: ${{ vars.GEMINI_QA_MODEL }}
          INFOGRAPHIC_VARIANTS: ${{ vars.INFOGRAPHIC_VARIANTS }}
          TEST_PMID: ${{ inputs.pmid }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/generate-approved-infographics.mjs

      - name: Create the downloadable ZIP
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          filename="gastro-infographic-${{ inputs.pmid || github.run_number }}-${{ github.run_id }}.zip"
          zip -r "$filename" infographics/
          echo "GDRIVE_ZIP=$filename" >> "$GITHUB_ENV"

      - name: Keep ZIP available in GitHub
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: gastro-infographic-variants-${{ inputs.pmid || github.run_number }}
          path: ${{ env.GDRIVE_ZIP }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP automatically to Google Drive
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GDRIVE_UPLOAD_URL: ${{ secrets.GDRIVE_UPLOAD_URL }}
          GDRIVE_UPLOAD_TOKEN: ${{ secrets.GDRIVE_UPLOAD_TOKEN }}
        run: |
          base64 -w 0 "$GDRIVE_ZIP" > upload.b64

          jq -n \
            --arg filename "$GDRIVE_ZIP" \
            --rawfile data upload.b64 \
            '{filename: $filename, data: $data}' > upload.json

          response="$(curl --fail-with-body --silent --show-error \
            -X POST "${GDRIVE_UPLOAD_URL}?token=${GDRIVE_UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @upload.json)"

          echo "$response"
          echo "$response" | jq -e '.ok == true' > /dev/null

      - name: Save generated files in the repository
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          if ! git diff --quiet -- data/infographic-manifest.json infographics; then
            git config user.name "gastro-updates-bot"
            git config user.email "gastro-updates-bot@users.noreply.github.com"
            git add data/infographic-manifest.json infographics
            git commit -m "Generate approved article infographic"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
