name: Daily medical update review

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Search trusted literature
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
        run: node scripts/fetch-updates.mjs

      - name: Save hidden review candidates
        shell: bash
        run: |
          if ! git diff --quiet -- data/updates.json; then
            git config user.name "gastro-updates-bot"
            git config user.email "gastro-updates-bot@users.noreply.github.com"
            git add data/updates.json
            git commit -m "Update daily medical review queue"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Send numbered review list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pending="$(jq '[.items[] | select(.reviewStatus == "pending")] | length' data/updates.json)"
          existing="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "Review pending gastroenterology updates") | .number' | head -n 1)"
          if [ "$pending" -gt 0 ]; then
            echo "## ${pending} articles waiting for your decision" > review-list.md
            echo "" >> review-list.md
            echo "Click any article title below to read the original PubMed page before deciding." >> review-list.md
            echo "" >> review-list.md
            jq -r '.items | to_entries[] | select(.value.reviewStatus == "pending") | "\(.key + 1). [\(.value.title)](\(.value.sourceUrl)) — **\(.value.category)**, \(.value.date)"' data/updates.json >> review-list.md
            echo "" >> review-list.md
            echo "## Reply templates" >> review-list.md
            echo "" >> review-list.md
            echo "Approve one article: **1**" >> review-list.md
            echo "" >> review-list.md
            echo "Approve several articles: **1, 4, 7**" >> review-list.md
            echo "" >> review-list.md
            echo "Approve every pending article: **ALL**" >> review-list.md
            echo "" >> review-list.md
            echo "Reject unsuitable articles: **REJECT: 2, 3**" >> review-list.md
            echo "" >> review-list.md
            echo "You only need to reply with the chosen number or numbers. Approved articles are published automatically." >> review-list.md
            if [ -z "$existing" ]; then
              gh issue create --title "Review pending gastroenterology updates" --body-file review-list.md
            else
              gh issue edit "$existing" --body-file review-list.md
              gh issue comment "$existing" --body-file review-list.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "No pending update candidates remain."
          fi
