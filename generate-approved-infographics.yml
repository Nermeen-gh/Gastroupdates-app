name: Generate approved infographics

on:
  push:
    paths:
      - data/updates.json
  workflow_dispatch:
    inputs:
      pmid:
        description: Optional PMID for a controlled test
        required: false
      dry_run:
        description: Validate selection without calling Gemini
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gastro-approved-infographics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and verify newly approved infographics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GEMINI_QA_MODEL: ${{ vars.GEMINI_QA_MODEL }}
          INFOGRAPHIC_VARIANTS: ${{ vars.INFOGRAPHIC_VARIANTS }}
          TEST_PMID: ${{ inputs.pmid }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/generate-approved-infographics.mjs
      - name: Commit passing outputs and QA records
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if ! git diff --quiet -- data/infographic-manifest.json infographics; then
            git config user.name "gastro-updates-bot"
            git config user.email "gastro-updates-bot@users.noreply.github.com"
            git add data/infographic-manifest.json infographics
            git commit -m "Generate approved article infographic"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
